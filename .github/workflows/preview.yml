# Plan § 3 / § 4 (ADR 0003): build the digest preview in CI and publish it to GitHub Pages.
# The preview never enters the repo: it is built here and deployed as a Pages artifact.
name: preview
on:
  workflow_dispatch:
    inputs:
      marker:
        description: "with = banner shows LANE_MARKER (secret) · without = LANE_MARKER unset (clean-up, plan § 4)"
        type: choice
        options: [with, without]
        default: with
      night:
        description: "night to preview"
        default: "2026-10-28"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Run rig and save the page as one HTML file
        env:
          LANE_MARKER: ${{ inputs.marker == 'with' && secrets.LANE_MARKER || '' }}
          NIGHT: ${{ inputs.night }}
        run: |
          pnpm start > rig.log 2>&1 &
          for i in $(seq 1 30); do curl -fs localhost:8787/health >/dev/null && break; sleep 1; done
          mkdir -p _site
          curl -fsS "localhost:8787/digest/$NIGHT" -o _site/index.html
          if [ -n "$LANE_MARKER" ]; then
            grep -qF "$LANE_MARKER" _site/index.html || { echo "marker missing from preview"; exit 1; }
          else
            grep -qF "no marker set" _site/index.html || { echo "preview still carries a marker"; exit 1; }
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
